  <script>
    function clearInput () {
      document.getElementById('card').value = ''; // 清空输入框内容
    }


    function search () {
      const searchValue = document.getElementById('card').value.replace(/\s/g, '').trim().toLowerCase().substring(0, 6); // 去除所有空白字符并保留前六位
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';

      if (searchValue.length < 6) {
        return; // 如果输入字符数小于四位，不执行搜索操作
      }

      let found = false;
      let resultString = ''; // 存储搜索结果的字符串

      excelData.forEach(item => {
        const bankNoStr = item.bank_no.toString();
        if (bankNoStr.startsWith(searchValue)) {
          if (found) {
            resultString += ', '; // 在结果之间添加逗号分隔
          }
          resultString += item.bank_name; // 将银行名称添加到结果字符串中
          found = true;
        }
      });

      if (found) {
        resultDiv.innerHTML = resultString; // 将结果字符串设置为结果 div 的内容
      } else {
        resultDiv.innerHTML = 'No results found';
      }
    }
    function initCmbRegions () {
      const select = document.getElementById('cmbRegionSelect');
      Object.keys(regionCodes).forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        select.appendChild(option);
      });
    }
    initCmbRegions();
    // 监听输入事件
    document.getElementById('card').addEventListener('input', search);
    // 在最后的<script>标签内添加
    document.getElementById('copyAllButton').addEventListener('click', function () {
      try {
        // 获取所有生成的卡号
        const preElements = document.querySelectorAll('#rslt pre');
        const allCards = Array.from(preElements)
          .map(pre => pre.textContent.trim())
          .join('\n');

        if (!allCards) {
          toptip.show('没有可复制的内容');
          return;
        }

        // 使用现代剪贴板API
        navigator.clipboard.writeText(allCards).then(() => {
          toptip.show('复制成功！');
        }).catch(err => {
          console.error('复制失败:', err);
          toptip.show('复制失败，请手动选择复制');
        });
      } catch (err) {
        console.error('复制错误:', err);
        toptip.show('复制功能不可用');
      }
    });
    document.getElementById('copyAllButton').addEventListener('click', async function () {
      const btn = this;
      try {
        // 添加按钮状态
        btn.classList.add('copying');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 复制中...';

        const preElements = document.querySelectorAll('#rslt pre');
        // ...原有复制逻辑保持不变...
        const allCards = Array.from(preElements)
          .map(pre => {
            // 移除可能存在的地区码注释
            return pre.textContent.replace(/$.*?$/g, '').trim();
          })
          .filter(text => text.length > 0)
          .join('\n');

        if (!allCards) {
          toptip.show('没有可复制的内容');
          return;
        }
        // 成功状态
        btn.classList.remove('btn-danger', 'copying');
        btn.classList.add('btn-success');
        btn.innerHTML = '✓ 复制成功';

        // 2秒后恢复原始状态
        setTimeout(() => {
          btn.classList.remove('btn-success');
          btn.classList.add('btn-danger');
          btn.innerHTML = '一键复制';
        }, 2000);

      } catch (err) {
        // 错误状态
        btn.classList.remove('btn-danger', 'copying');
        btn.classList.add('btn-warning');
        btn.innerHTML = '✕ 复制失败';

        setTimeout(() => {
          btn.classList.remove('btn-warning');
          btn.classList.add('btn-danger');
          btn.innerHTML = '一键复制';
        }, 2000);
      }
    });
  </script>
